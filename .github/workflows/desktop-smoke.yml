name: Desktop packaged smoke

on:
  pull_request:
  push:

jobs:
  packaged-python:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS arm64
            runner: macos-15
          - target: macOS x64
            runner: macos-15-intel
          - target: Windows arm64
            runner: windows-11-arm
          - target: Windows x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
        if: matrix.runner != 'windows-11-arm'
      # workerd has no Windows ARM64 binary and is only needed by the web build,
      # not by Electron packaging. Keep Electron's own install step explicit.
      - run: npm ci --ignore-scripts
        if: matrix.runner == 'windows-11-arm'
      - run: npm rebuild electron --workspace @stewie/desktop
        if: matrix.runner == 'windows-11-arm'
      - run: npm run desktop:package
      - run: npm run smoke:packaged-python
      - run: npm run smoke:packaged-renderer
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-failure-${{ matrix.runner }}
          path: windows-smoke-failure.png
