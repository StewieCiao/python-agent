name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  make:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS arm64
            runner: macos-15
            asset: macos-arm64
          - target: macOS x64
            runner: macos-15-intel
            asset: macos-x64
          - target: Windows arm64
            runner: windows-11-arm
            asset: windows-arm64
          - target: Windows x64
            runner: windows-2025
            asset: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
        if: matrix.runner != 'windows-11-arm'
      # workerd has no Windows ARM64 binary and is not required by Electron packaging.
      - run: npm ci --ignore-scripts
        if: matrix.runner == 'windows-11-arm'
      # Squirrel's install script selects the host-architecture 7-Zip executable.
      - run: npm rebuild electron electron-winstaller --workspace @stewie/desktop
        if: matrix.runner == 'windows-11-arm'
      - run: npm run desktop:make
      - run: npm run smoke:packaged-python
      - run: npm run smoke:packaged-renderer
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: stewie-learnos-${{ matrix.asset }}
          path: desktop/out/make/**
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.ref_type == 'tag'
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stewie-learnos-*
          path: release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - run: npm run build:pages
      - name: Prepare stable release names and checksums
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          desktop_version="$(node -p 'require("./desktop/package.json").version')"
          test "$version" = "$desktop_version"
          test "$GITHUB_REF_NAME" = "v$version"
          tar -czf pages.tar.gz -C dist-pages .
          node scripts/prepare-release-assets.mjs release-assets release-upload "$version" "Stewie-个人学习站-离线版.html" pages.tar.gz
      - name: Create public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-upload/* --repo "${GITHUB_REPOSITORY}" --title "Stewie LearnOS ${GITHUB_REF_NAME}" --generate-notes
